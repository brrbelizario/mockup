<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoEnergy - Dashboard B2C</title>
    <!-- Tipo de letra DM Sans para um aspeto moderno e automóvel -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #050505; /* Fundo muito escuro para contraste */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .dashboard-container {
            background-color: #0A0A0A;
            border: 1px solid #1A1A1A;
        }

        .card-bg {
            background-color: #141414;
            border: 1px solid #1F1F1F;
        }

        /* Animação suave para o gráfico circular */
        .circle-progress {
            stroke-dasharray: 351;
            stroke-dashoffset: 351;
            animation: fillCircle 1.5s ease-out forwards;
        }

        @keyframes fillCircle {
            to { stroke-dashoffset: 70; } /* 80% de preenchimento */
        }
        
        /* Animação do módulo laranja */
        .pulse-warning {
            animation: pulse-orange 2s infinite;
        }
        
        @keyframes pulse-orange {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="text-white">

    <!-- Contentor Principal do Ecrã -->
    <div class="dashboard-container w-full max-w-4xl rounded-2xl p-6 sm:p-10 shadow-2xl">
        
        <!-- Cabeçalho -->
        <header class="flex items-center space-x-6 mb-12">
            <div class="flex items-center space-x-2">
                <svg class="w-6 h-6 text-[#22C55E]" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" />
                </svg>
                <h1 class="text-3xl font-bold tracking-tight">MoEnergy</h1>
            </div>
            <!-- Divisor e Status -->
            <div class="flex items-center space-x-3 border-l border-gray-700 pl-6">
                <div class="w-2.5 h-2.5 rounded-full bg-[#22C55E] animate-pulse"></div>
                <span class="text-sm font-medium text-gray-300">Sistema conectado</span>
            </div>
        </header>

        <!-- Secção Superior: Gráficos e Carro -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-8 mb-10">
            
            <div class="flex items-center gap-10 w-full md:w-auto">
                <!-- Gráfico Circular 80% -->
                <div class="relative w-36 h-36 flex-shrink-0">
                    <svg class="w-full h-full transform -rotate-90">
                        <circle cx="72" cy="72" r="62" stroke="#262626" stroke-width="10" fill="none" />
                        <circle cx="72" cy="72" r="62" stroke="#22C55E" stroke-width="10" fill="none" class="circle-progress" stroke-linecap="round" />
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span class="text-4xl font-bold">80<span class="text-2xl">%</span></span>
                        <span class="text-xs text-gray-400 mt-1 font-medium tracking-wide">Bateria</span>
                    </div>
                </div>

                <!-- Autonomia -->
                <div class="flex flex-col">
                    <span class="text-sm text-gray-300 mb-1 font-medium">Autonomia estimada</span>
                    <div class="flex items-baseline space-x-2">
                        <span class="text-6xl font-bold text-[#22C55E] tracking-tight">238</span>
                        <span class="text-2xl font-medium text-gray-300">km</span>
                    </div>
                </div>
            </div>

            <!-- Gráfico do Veículo em Fio de Arame (Wireframe) -->
            <!-- Gráfico do Veículo (Design Premium SUV Estilo bZ4X) -->
            <div class="w-full max-w-md">
                <svg viewBox="0 0 600 240" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto drop-shadow-2xl">
                    <!-- Detalhe de Brilho no Chão -->
                    <ellipse cx="300" cy="210" rx="220" ry="8" fill="#22C55E" opacity="0.05" />

                    <!-- Silhueta Principal do SUV -->
                    <path d="M 60 170 L 80 170 A 45 45 0 0 1 170 170 L 430 170 A 45 45 0 0 1 520 170 L 540 170 C 570 170 580 150 570 130 C 550 100 520 90 470 80 L 390 45 C 320 25 220 25 150 50 L 80 90 C 40 110 30 140 40 160 C 45 170 50 170 60 170 Z" fill="#141414" stroke="#52525b" stroke-width="3" stroke-linejoin="round"/>

                    <!-- Vidros Escurecidos -->
                    <path d="M 155 60 C 220 40 310 40 380 55 L 460 85 L 100 95 Z" fill="#1C1C1E" stroke="#3f3f46" stroke-width="2" stroke-linejoin="round"/>

                    <!-- Pilares do Carro recortando o vidro -->
                    <line x1="260" y1="46" x2="250" y2="92" stroke="#141414" stroke-width="14"/>
                    <line x1="390" y1="60" x2="360" y2="90" stroke="#141414" stroke-width="20"/>

                    <!-- Linha de Cintura Lateral -->
                    <path d="M 70 115 C 200 100 400 100 565 125" stroke="#27272a" stroke-width="2"/>

                    <!-- Farol Frontal (LED Azulado) -->
                    <path d="M 42 115 L 75 110 L 95 115" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M 42 115 L 55 130" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>

                    <!-- Farolim Traseiro (LED Vermelho) -->
                    <path d="M 568 126 L 535 120 L 505 125" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    
                    <!-- Rodas Modernas -->
                    <!-- Roda Dianteira -->
                    <circle cx="125" cy="170" r="34" stroke="#3f3f46" stroke-width="6" fill="#09090b"/>
                    <circle cx="125" cy="170" r="22" stroke="#52525b" stroke-width="2" stroke-dasharray="6 4"/>
                    <circle cx="125" cy="170" r="6" fill="#a1a1aa"/>
                    
                    <!-- Roda Traseira -->
                    <circle cx="475" cy="170" r="34" stroke="#3f3f46" stroke-width="6" fill="#09090b"/>
                    <circle cx="475" cy="170" r="22" stroke="#52525b" stroke-width="2" stroke-dasharray="6 4"/>
                    <circle cx="475" cy="170" r="6" fill="#a1a1aa"/>

                    <!-- Caixa de Proteção do Pack de Bateria (Floorpan) -->
                    <rect x="175" y="155" width="250" height="24" rx="4" fill="#050505" stroke="#52525b" stroke-width="2"/>

                    <!-- Módulos de Bateria -->
                    <g stroke="#1A1A1A" stroke-width="2">
                        <rect x="183" y="159" width="26" height="16" rx="2" fill="#22C55E" />
                        <rect x="213" y="159" width="26" height="16" rx="2" fill="#22C55E" />
                        <rect x="243" y="159" width="26" height="16" rx="2" fill="#22C55E" />
                        
                        <!-- Módulo em Alerta a Piscar -->
                        <rect x="273" y="159" width="26" height="16" rx="2" fill="#EAB308" class="pulse-warning" />
                        
                        <rect x="303" y="159" width="26" height="16" rx="2" fill="#22C55E" />
                        <rect x="333" y="159" width="26" height="16" rx="2" fill="#22C55E" />
                        <rect x="363" y="159" width="26" height="16" rx="2" fill="#22C55E" />
                        <rect x="393" y="159" width="26" height="16" rx="2" fill="#22C55E" />
                    </g>
                </svg>
            </div>
        </div>

        <!-- Secção Inferior: Cartões de Diagnóstico -->
        <div class="space-y-4">
            
            <!-- Cartão 1: Modo de Condução -->
            <div class="card-bg rounded-xl p-5 flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-6 transition hover:bg-[#181818]">
                <div class="flex items-center space-x-4">
                    <div class="bg-[#22C55E]/10 p-2 rounded-full text-[#22C55E]">
                        <i data-lucide="check-circle" class="w-6 h-6"></i>
                    </div>
                    <span class="font-bold text-lg text-white">Modo:</span>
                    <span class="text-[#22C55E] text-sm font-semibold leading-tight">Preservação<br>Celular</span>
                </div>
                <div class="hidden sm:block w-px h-10 bg-gray-700 mx-2"></div>
                <p class="text-[#EAB308] text-xs sm:text-sm font-medium leading-relaxed">
                    Alerta contornado: Limite de recarga otimizado para<br>proteger o Módulo 2
                </p>
            </div>

            <!-- Cartão 2: Temperatura e Ganhos -->
            <div class="card-bg rounded-xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-6 transition hover:bg-[#181818]">
                
                <div class="flex items-center space-x-5">
                    <div class="text-[#22C55E]">
                        <i data-lucide="thermometer" class="w-8 h-8"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-sm font-medium text-gray-300">Temperatura da bateria</span>
                        <span class="text-xl font-bold text-white mt-0.5">31 ºC</span>
                    </div>
                </div>
                
                <div class="hidden sm:block w-px h-12 bg-gray-700"></div>
                
                <div class="flex items-center space-x-6 w-full sm:w-auto justify-start sm:justify-end">
                    <!-- Etiqueta do Desvio -->
                    <div class="bg-[#0f2e1a] border border-[#166534] rounded-lg p-2.5 flex flex-col justify-center">
                        <span class="text-gray-300 text-[11px] font-semibold leading-tight">
                            Desvio de<br>Tensão: 42 mV<br>(Módulo 3)
                        </span>
                    </div>
                    <!-- Ganho Estimado -->
                    <div class="flex flex-col">
                        <span class="text-[#22C55E] text-sm font-medium">Ganho de Vida</span>
                        <span class="text-[#22C55E] text-sm font-medium">Útil: <span class="font-bold text-lg">+12</span></span>
                        <span class="text-[#22C55E] text-sm font-medium">meses</span>
                    </div>
                </div>
            </div>

            <!-- Cartão 3: Botão de Ação -->
            <button class="w-full flex items-center justify-between card-bg hover:bg-[#1C1C1E] transition-colors rounded-xl p-5 border border-transparent focus:border-[#22C55E] outline-none">
                <div class="flex items-center space-x-4 text-[#22C55E]">
                    <i data-lucide="clipboard-list" class="w-6 h-6"></i>
                    <span class="font-bold text-lg">Ver diagnóstico</span>
                </div>
                <i data-lucide="chevron-right" class="w-6 h-6 text-gray-500"></i>
            </button>

        </div>
    </div>

    <script>
        // Inicializar os ícones SVG do Lucide
        lucide.createIcons();
    </script>
</body>
</html>
